[versions]
agp = "9.3.1"
arcore = "1.56.0"
opencv = "4.14.0"
gson = "2.11.0"
coroutines = "1.10.2"
junit = "4.13.2"
composeCompiler = "2.2.10"
composeBom = "2025.08.01"
activity = "1.10.1"
datastore = "1.1.7"
media3 = "1.10.1"
[libraries]
arcore = { module = "com.google.ar:core", version.ref = "arcore" }
opencv = { module = "org.opencv:opencv", version.ref = "opencv" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "composeCompiler" }
